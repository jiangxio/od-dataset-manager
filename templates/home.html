<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>目标检测分析平台</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <header>
        <h1>目标检测分析平台</h1>
    </header>
    <div class="home-container">
        <div class="home-topbar">
            <h2>项目列表</h2>
            <button id="btn-create" class="btn-primary">+ 新建项目</button>
        </div>
        <div id="project-grid"></div>
        <div id="home-message"></div>
    </div>

    <!-- Create / Edit Modal -->
    <div id="proj-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-header">
                <strong id="proj-modal-title">新建项目</strong>
                <button class="modal-close" id="proj-modal-close">×</button>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <label>项目名称 <span class="req">*</span></label>
                    <input type="text" id="proj-name" placeholder="例：打电话检测" />
                </div>
                <div class="form-row">
                    <label>类别（每行一个）</label>
                    <textarea id="proj-classes" rows="4" placeholder="call_phone&#10;not_call_phone&#10;other"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button id="proj-modal-cancel">取消</button>
                <button id="proj-modal-save" class="btn-primary">保存</button>
            </div>
        </div>
    </div>

    <script>
    const BASE_DIR = {{ base_dir | tojson | safe }};

    let editingId = null;

    function showMsg(text, isError) {
        const el = document.getElementById('home-message');
        el.textContent = text;
        el.style.color = isError ? '#e04838' : '#3098d8';
        setTimeout(() => { el.textContent = ''; }, 3000);
    }

    // ── Project list ───────────────────────────────────────
    function loadProjects() {
        fetch('/api/projects').then(r => r.json()).then(projects => {
            const grid = document.getElementById('project-grid');
            grid.innerHTML = '';
            if (!projects.length) {
                grid.innerHTML = '<p class="empty-tip">暂无项目，点击「新建项目」开始</p>';
                return;
            }
            projects.forEach(p => {
                const card = document.createElement('div');
                card.className = 'project-card';
                const hasData = p.images_dir;
                const infoHtml = hasData
                    ? `<div class="project-card-info"><span class="info-label">图片：</span><span class="info-value" title="${escHtml(p.images_dir)}">${escHtml(shortenPath(p.images_dir))}</span></div>
                       <div class="project-card-info"><span class="info-label">标注：</span><span class="info-value" title="${escHtml(p.labels_dir)}">${escHtml(shortenPath(p.labels_dir))}</span></div>`
                    : `<div class="project-card-info"><span class="info-label">数据通过版本管理</span></div>`;
                card.innerHTML = `
                    <div class="project-card-title">${escHtml(p.name)}</div>
                    ${infoHtml}
                    <div class="project-card-classes">${(p.classes||[]).map(c => `<span class="class-tag">${escHtml(c)}</span>`).join('')}</div>
                    <div class="project-card-actions">
                        <button class="btn-primary btn-open" data-id="${p.id}">打开</button>
                        <button class="btn-edit" data-id="${p.id}">编辑</button>
                        <button class="btn-danger btn-del" data-id="${p.id}">删除</button>
                    </div>`;
                grid.appendChild(card);
            });

            grid.querySelectorAll('.btn-open').forEach(btn => {
                btn.addEventListener('click', () => { window.location.href = `/project/${btn.dataset.id}`; });
            });
            grid.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', () => {
                    const proj = projects.find(p => p.id === btn.dataset.id);
                    if (proj) openEditModal(proj);
                });
            });
            grid.querySelectorAll('.btn-del').forEach(btn => {
                btn.addEventListener('click', () => deleteProject(btn.dataset.id));
            });
        });
    }

    function deleteProject(id) {
        if (!confirm('确认删除该项目？（不会删除磁盘上的文件）')) return;
        fetch(`/api/projects/${id}`, {method: 'DELETE'}).then(r => r.json()).then(d => {
            if (d.success) { showMsg('删除成功'); loadProjects(); }
        });
    }

    function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function shortenPath(p) {
        if (!p) return '';
        if (p.length <= 45) return p;
        return '…' + p.slice(-42);
    }

    // ── Modal ──────────────────────────────────────────────
    function openCreateModal() {
        editingId = null;
        document.getElementById('proj-modal-title').textContent = '新建项目';
        document.getElementById('proj-name').value = '';
        document.getElementById('proj-classes').value = 'call_phone\nnot_call_phone\nother';
        document.getElementById('proj-modal').style.display = 'flex';
    }

    function openEditModal(proj) {
        editingId = proj.id;
        document.getElementById('proj-modal-title').textContent = '编辑项目';
        document.getElementById('proj-name').value = proj.name;
        document.getElementById('proj-classes').value = (proj.classes || []).join('\n');
        document.getElementById('proj-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('proj-modal').style.display = 'none';
    }

    document.getElementById('btn-create').addEventListener('click', openCreateModal);
    document.getElementById('proj-modal-close').addEventListener('click', closeModal);
    document.getElementById('proj-modal-cancel').addEventListener('click', closeModal);

    document.getElementById('proj-modal-save').addEventListener('click', () => {
        const name = document.getElementById('proj-name').value.trim();
        const classesText = document.getElementById('proj-classes').value.trim();
        const classes = classesText.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);

        if (!name) { showMsg('请填写项目名称', true); return; }

        let payload, url, method;
        payload = {name, classes};
        if (editingId) {
            url = `/api/projects/${editingId}`;
            method = 'PUT';
        } else {
            url = '/api/projects';
            method = 'POST';
        }

        fetch(url, {method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)})
            .then(r => r.json()).then(d => {
                if (d.error) { showMsg(d.error, true); return; }
                closeModal();
                const msg = editingId ? '项目已更新' : '项目已创建，请在版本管理页面上传数据';
                showMsg(msg);
                loadProjects();
            }).catch(() => showMsg('操作失败', true));
    });

    loadProjects();
    </script>
</body>
</html>
